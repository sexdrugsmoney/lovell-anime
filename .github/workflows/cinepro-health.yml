name: CinePro Health Ping

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping CinePro (cold start önleme)
        run: |
          curl -sf "https://core-5fvt.onrender.com/scrape?tmdbId=1429&type=tv&season=1&episode=1" \
            --max-time 60 \
            -o /dev/null \
            && echo "CinePro yanıt verdi" \
            || echo "Uyandırma isteği gönderildi (cold start bekleniyor)"
