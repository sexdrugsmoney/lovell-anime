name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Prepare dist/
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            fs.rmSync('dist', {recursive:true, force:true});
            ['index.html', 'src/main.js', 'src/style.css', 'public'].forEach(rel => {
              const to = path.join('dist', rel);
              fs.mkdirSync(path.dirname(to), {recursive:true});
              fs.cpSync(rel, to, {recursive:true});
            });
            console.log('dist/ hazirlanadi');
          "

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy

      - name: Set Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.TMDB_READ_TOKEN }}" | npx wrangler secret put TMDB_READ_TOKEN --name lovell
          echo "${{ secrets.VIDROCK_RESOLVER_URL }}" | npx wrangler secret put VIDROCK_RESOLVER_URL --name lovell
          echo "e4202b" | npx wrangler secret put VIDRIFT_COLOR --name lovell
          echo "LOVELL" | npx wrangler secret put VIDRIFT_BRAND --name lovell
          echo "89244d93" | npx wrangler secret put OMDB_API_KEY --name lovell
        continue-on-error: true
