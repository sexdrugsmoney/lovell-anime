name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Prepare dist/
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            fs.rmSync('dist', {recursive:true, force:true});
            ['index.html', 'src/main.js', 'src/style.css', 'public'].forEach(rel => {
              const to = path.join('dist', rel);
              fs.mkdirSync(path.dirname(to), {recursive:true});
              fs.cpSync(rel, to, {recursive:true});
            });
            console.log('dist/ hazırlandı');
          "

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy
        env:
          CINEPRO_URL: ${{ secrets.CINEPRO_URL }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
