name: Deploy LOVELL → Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build dist/
        run: |
          rm -rf dist
          mkdir -p dist/src dist/public
          cp index.html dist/
          cp src/main.js dist/src/
          cp src/style.css dist/src/
          cp -r public/. dist/public/

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Upload TMDB secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: echo "${{ secrets.TMDB_READ_TOKEN }}" | npx --yes wrangler@4 secret put TMDB_READ_TOKEN
        continue-on-error: true

      - name: Upload CinePro URL secret
        if: ${{ secrets.CINEPRO_URL != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: echo "${{ secrets.CINEPRO_URL }}" | npx --yes wrangler@4 secret put CINEPRO_URL
        continue-on-error: true

      - name: Upload brand secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          echo "LOVELL" | npx --yes wrangler@4 secret put VIDRIFT_BRAND
          echo "e4202b" | npx --yes wrangler@4 secret put VIDRIFT_COLOR
        continue-on-error: true
