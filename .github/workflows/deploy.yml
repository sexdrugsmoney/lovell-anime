name: Deploy LOVELL → Cloudflare Workers

# main'e push veya elle tetikleme
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Statik dosyaları dist/ içine topla (sunucu kodu ve .env kopyalanmaz)
      - name: Build dist/
        run: |
          rm -rf dist
          mkdir -p dist/src dist/public
          cp index.html dist/
          cp src/main.js dist/src/
          cp src/style.css dist/src/
          cp -r public/. dist/public/
          # src/data/ sadece Worker için gerekli olmayan büyük dosya — taşıma
          # Eğer main.js data importu varsa ekle:
          # cp -r src/data dist/src/data

      # Cloudflare Workers'a deploy (wrangler.toml okunur)
      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}

      # Worker secret'larını yükle
      # GitHub Secrets'a eklemen gerekenler:
      #   CF_API_TOKEN   → Cloudflare dashboard > My Profile > API Tokens
      #   CF_ACCOUNT_ID  → Cloudflare dashboard sağ altında
      #   TMDB_READ_TOKEN → themoviedb.org > Settings > API > v4 token
      #   CINEPRO_URL    → Render'da çalışan CinePro URL'i (örn. https://cinepro-XXX.onrender.com)
      #   VIDRIFT_BRAND  → opsiyonel (varsayılan: LOVELL)
      #   VIDRIFT_COLOR  → opsiyonel (varsayılan: e4202b)
      - name: Upload Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 secret put TMDB_READ_TOKEN  <<< "${{ secrets.TMDB_READ_TOKEN }}"
          npx --yes wrangler@4 secret put CINEPRO_URL      <<< "${{ secrets.CINEPRO_URL }}"
          # Opsiyonel brand ayarları
          if [ -n "${{ secrets.VIDRIFT_BRAND }}" ]; then
            npx --yes wrangler@4 secret put VIDRIFT_BRAND  <<< "${{ secrets.VIDRIFT_BRAND }}"
          fi
          if [ -n "${{ secrets.VIDRIFT_COLOR }}" ]; then
            npx --yes wrangler@4 secret put VIDRIFT_COLOR  <<< "${{ secrets.VIDRIFT_COLOR }}"
          fi
