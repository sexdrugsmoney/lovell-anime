name: Türkçe arşiv dizinini güncelle

# GenesisAnime veri seti (MIT) güncellendikçe AniList → kayıt eşlemesini yeniler.
# Değişiklik varsa commit atar; bu commit "Deploy to Cloudflare Workers" iş akışını tetikler.
on:
  schedule:
    - cron: '17 4 * * 1'   # her pazartesi 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dizini üret
        run: node scripts/build-tr-archive.mjs
      - name: Değiştiyse commit et
        run: |
          if git diff --quiet -- src/data/tr-archive-index.js; then echo "Değişiklik yok"; exit 0; fi
          git config user.name "lovell-bot"
          git config user.email "lovell-bot@users.noreply.github.com"
          git add src/data/tr-archive-index.js
          git commit -m "chore: Türkçe arşiv dizini güncellendi"
          git push
